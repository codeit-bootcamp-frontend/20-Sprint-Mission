<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="icon" href="images/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/auth.css" />
  </head>
  <body>
    <div class="wrapper">
      <a href="/">
        <img src="/images/logo.svg" alt="판다마켓 로고" width="300" />
      </a>
      <form>
        <div class="input-contain">
          <label for="join-email">이메일</label>
          <input
            id="join-email"
            name="email"
            type="email"
            required
            placeholder="이메일을 입력해주세요"
            class="email"
          />
          <p class="error-message email-none">이메일을 입력해주세요.</p>
          <p class="error-message email-wrong">잘못된 이메일 형식입니다.</p>
        </div>
        <div class="input-contain">
          <label for="join-nickname">닉네임</label>
          <input
            id="join-nickname"
            name="nickname"
            type="text"
            placeholder="닉네임을 입력해주세요"
          />
        </div>
        <div class="input-contain">
          <label for="join-password">비밀번호</label>
          <div class="pw-wrapper">
            <div class="bt-wrapper">
              <input
                id="join-password"
                name="password"
                type="password"
                required
                minlength="8"
                placeholder="비밀번호를 입력해주세요"
                class="password"
              />
              <button type="button">
                <img
                  src="/images/view-pw.webp"
                  alt="비밀번호 보이는 아이콘"
                  width="30"
                  class="view-bt-icon"
                />
                <img
                  src="/images/no-view-pw.webp"
                  alt="비밀번호 안 보이는 아이콘"
                  width="30"
                  class="no-view-bt-icon"
                />
              </button>
            </div>
            <p class="error-message password-none">비민번호를 입력해주세요.</p>
            <p class="error-message password-wrong">
              비밀번호를 8자 이상 입력해주세요.
            </p>
          </div>
        </div>
        <div class="input-contain">
          <label for="join-password-confirm">비밀번호 확인</label>
          <div class="pw-wrapper">
            <div class="bt-wrapper">
              <input
                id="join-password-confirm"
                name="password-confirm"
                type="password"
                required
                minlength="8"
                placeholder="비밀번호를 다시 한 번 입력해주세요"
                class="password-confirm"
              />
              <button type="button">
                <img
                  src="/images/view-pw.webp"
                  alt="비밀번호 보이는 아이콘"
                  width="30"
                  class="view-bt-icon confirm"
                />
                <img
                  src="/images/no-view-pw.webp"
                  alt="비밀번호 안 보이는 아이콘"
                  width="30"
                  class="no-view-bt-icon confirm"
                />
              </button>
            </div>
            <p class="error-message password-confirm">
              비밀번호가 일치하지 않습니다.
            </p>
          </div>
        </div>
        <button type="submit" class="button auth-bt join">회원가입</button>
      </form>

      <div class="simple-login">
        <p>간편 로그인하기</p>
        <div>
          <a
            href="https://www.google.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="/images/google-login.webp" alt="구글 로그인" width="50" />
          </a>
          <a
            href="https://www.kakaocorp.com/page/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              src="/images/kakao-login.webp"
              alt="카카오 로그인"
              width="50"
            />
          </a>
        </div>
      </div>
      <p class="account-message">
        이미 회원이신가요? <a href="./login.html">로그인</a>
      </p>
    </div>
    <script type="module" src="./auth.js"></script>
  </body>
</html>

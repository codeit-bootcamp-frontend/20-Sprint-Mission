<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>회원가입 - 판다마켓</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="./assets/icons/Property 1=lg1.png" />
  <link rel="shortcut icon" type="image/png" href="./assets/icons/Property 1=lg1.png" />
  <!-- CSS -->
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/pages/signup.css">
  
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
  />
</head>
<body>
  <!-- Main Content -->
  <main class="main">
    <div class="signup-container">
      <!-- Logo Section -->
      <div class="logo-section">
        <a href="index.html" class="logo-link">
          <img src="./assets/icons/Property 1=lg-1.svg" alt="판다마켓" class="main-logo" />
        </a>
      </div>

      <!-- Signup Form -->
      <div class="form-section">
        <form class="signup-form">
          <!-- Email Input -->
          <div class="input-group">
            <label for="email" class="input-label">이메일</label>
            <div class="input-wrapper">
              <input type="email" id="email" name="email" class="input-field" placeholder="codeit@email.com" required>
            </div>
          </div>

          <!-- Nickname Input -->
          <div class="input-group">
            <label for="nickname" class="input-label">닉네임</label>
            <div class="input-wrapper">
              <input type="text" id="nickname" name="nickname" class="input-field" placeholder="판다" required>
            </div>
          </div>

          <!-- Password Input -->
          <div class="input-group">
            <label for="password" class="input-label">비밀번호</label>
            <div class="input-wrapper password-wrapper">
              <input type="password" id="password" name="password" class="input-field" placeholder="비밀번호를 입력해주세요" required>
              <button type="button" id="passwordToggle" class="password-toggle-btn">
                <img src="./assets/icons/eyeopen.png" alt="비밀번호 보기" class="eye-icon" />
              </button>
            </div>
          </div>

          <!-- Password Confirm Input -->
          <div class="input-group">
            <label for="passwordConfirm" class="input-label">비밀번호 확인</label>
            <div class="input-wrapper password-wrapper">
              <input type="password" id="passwordConfirm" name="passwordConfirm" class="input-field" placeholder="비밀번호를 다시 입력해주세요" required>
              <button type="button" id="passwordConfirmToggle" class="password-toggle-btn">
                <img src="./assets/icons/eyeopen.png" alt="비밀번호 보기" class="eye-icon" />
              </button>
            </div>
          </div>

          <!-- Signup Button -->
          <button type="submit" class="btn-signup">
            <span class="btn-text">회원가입</span>
          </button>
        </form>

        <!-- Social Login -->
        <div class="social-login">
          <div class="social-header">
            <span class="social-title">간편 회원가입하기</span>
            <div class="social-buttons">
              <a href="https://www.google.com/" class="social-btn google-btn" target="_blank" rel="noopener noreferrer">
                <div class="social-icon google-icon">
                  <img src="./assets/icons/ic_google.png" alt="Google" width="22" height="22" />
                </div>
              </a>
              <a href="https://www.kakaocorp.com/page/" class="social-btn kakao-btn" target="_blank" rel="noopener noreferrer">
                <div class="social-icon kakao-icon">
                  <img src="./assets/icons/ic_kakao.png" alt="Kakao" width="22" height="22" />
                </div>
              </a>
            </div>
          </div>
        </div>

        <!-- Login Link -->
        <div class="login-link">
          <span class="login-text">이미 회원이신가요?</span>
          <a href="login.html" class="login-btn">로그인</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    // 비밀번호 보기/숨기기 기능
    document.getElementById('passwordToggle').addEventListener('click', function() {
      const passwordField = document.getElementById('password');
      const eyeIcon = this.querySelector('.eye-icon');

      if (passwordField.type === 'password') {
        passwordField.type = 'text';
        eyeIcon.src = './assets/icons/eyeclose.png';
        eyeIcon.alt = '비밀번호 숨기기';
      } else {
        passwordField.type = 'password';
        eyeIcon.src = './assets/icons/eyeopen.png';
        eyeIcon.alt = '비밀번호 보기';
      }
    });

    // 비밀번호 확인 보기/숨기기 기능
    document.getElementById('passwordConfirmToggle').addEventListener('click', function() {
      const passwordField = document.getElementById('passwordConfirm');
      const eyeIcon = this.querySelector('.eye-icon');

      if (passwordField.type === 'password') {
        passwordField.type = 'text';
        eyeIcon.src = './assets/icons/eyeclose.png';
        eyeIcon.alt = '비밀번호 숨기기';
      } else {
        passwordField.type = 'password';
        eyeIcon.src = './assets/icons/eyeopen.png';
        eyeIcon.alt = '비밀번호 보기';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="판다 마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:url" content="/" />
    <link rel="stylesheet" href="css/auth.css" />
    <title>회원가입 | 판다마켓</title>
  </head>
  <body>
    <div id="wrap">
      <main id="cnt" class="login_area">
        <div class="login_wrap">
          <div class="logo_box">
            <a href="/" class="logo blind">홈으로 돌아가기</a>
          </div>
          <form action="/">
            <div class="inp_box">
              <label for="email">이메일</label>
              <input type="text" id="email" />
            </div>
            <div class="inp_box">
              <label for="name">닉네임</label>
              <input type="text" id="name" />
            </div>
            <div class="inp_box">
              <label for="password">비밀번호</label>
              <input type="password" id="password" />
            </div>
            <div class="inp_box">
              <label for="password_confirm">비밀번호 확인</label>
              <input type="password" id="password_confirm" />
            </div>
            <div class="btn_box">
              <button type="submit" class="btn round large bg_primary_100 full">회원가입</button>
            </div>
          </form>
          <div class="easy_login_box">
            간편 로그인하기
            <div class="sns_login_box">
              <a href="#;" class="google_login blind">구글로 로그인하기</a>
              <a href="#;" class="kakao_login blind">카카오톡으로 로그인하기</a>
            </div>
          </div>
          <p class="signup_desc">
            이미 회원이신가요?
            <a href="signup.html" class="signup_link">로그인</a>
          </p>
        </div>
      </main>
    </div>
  </body>
</html>

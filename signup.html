<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>판다 마켓</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="login.css" />
    <script src="signup.js"></script>
  </head>

  <body>
    <div class="container">
      <a href="/"><img id="panda-market" src="/images/logo.png" /></a>

      <div class="inner-container">
        <div class="input-title">이메일</div>
        <input
          id="email"
          class="login-input"
          type="email"
          placeholder="이메일을 입력해주세요"
          onblur="onEmailBlur()"
          onfocus="onEmailFocus()"
        />
        <div id="email-status"></div>

        <div class="input-title">닉네임</div>
        <input
          id="nickname"
          class="login-input"
          type="text"
          placeholder="닉네임을 입력해주세요"
          onblur="onNicknameBlur()"
          onfocus="onNicknameFocus()"
        />
        <div id="nickname-status"></div>

        <div class="input-title">비밀번호</div>
        <input
          id="password"
          class="login-input"
          type="password"
          placeholder="비밀번호를 입력해주세요"
          onblur="onPasswordBlur()"
          onfocus="onPasswordFocus()"
        />
        <div id="password-status"></div>

        <div class="input-title">비밀번호 확인</div>
        <input
          id="password-confirm"
          class="login-input"
          type="password"
          placeholder="비밀번호를 다시 한 번 입력해주세요"
          onblur="onPasswordConfirmBlur()"
          onfocus="onPasswordConfirmFocus()"
        />
        <div id="password-confirm-status"></div>

        <button class="login-button blue-button disabled" onclick="goLogin()">
          회원가입
        </button>

        <div class="register" id="register-panel">
          이미 회원이신가요? <a id="register-link" href="/login.html">로그인</a>
        </div>
      </div>
    </div>
  </body>
</html>

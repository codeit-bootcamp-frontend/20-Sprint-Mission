<!DOCTYPE html>
<html lang="ko">
    <head>
        <title>판다 마켓</title>
        <link rel="stylesheet" href="common.css"/>
        <link rel="stylesheet" href="login.css"/>
    </head>

    <body>
        <div class="container">
            <a href="/"><img id="panda-market" src="/images/logo.png"/></a>

            <div class="inner-container">
                <div class="input-title">이메일</div>
                <input class="login-input" type="email"/>

                <div class="input-title">닉네임</div>
                <input class="login-input" type="text"/>

                <div class="input-title">비밀번호</div>
                <div class="input-wrapper">
                    <input class="login-input" type="password"/>
                    <img class="eye" src="/images/eye_off.png"/>
                </div>    

                <div class="input-title">비밀번호 확인</div>
                <div class="input-wrapper">
                    <input class="login-input" type="text"/>
                    <img class="eye" src="/images/eye_on.png"/>
                </div>    

                <button class="login-button blue-button">회원가입</button>

                <div class="simple-login">
                    <div>간편 로그인하기</div>
                    <div class="sns-buttons">
                        <a href="https://www.google.com/"><img class="sns-button" src="/images/google.png"/></a>
                        <a href="https://www.kakaocorp.com/page/"><img class="sns-button" src="/images/kakao.png"/></a>
                    </div>
                </div>
                
                <div class="register" id="register-panel">이미 회원이신가요? <a id="register-link" href="/login.html">로그인</a></div>
            </div>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/login.css">
    <title>singup</title>
</head>
<body>
    <div class="login_box">
        <div class="logo_img"><a href="/index.html"><img src="img/lg.png" alt="판다마켓"></a></div>
        <div class="login_text">
            <p class="login_tx">이메일</p>
            <input class="login_input" type="text" placeholder="이메일을 입력해주세요">
            <p class="login_tx">비밀번호</p>
            <div class="input_wrapper">
                <input class="login_input password" type="password" placeholder="비밀번호를 입력해주세요">
                <img class="toggle_pw" src="img/btn_visibility_off.png" alt="비밀번호 보기">
            </div>
            <p class="login_tx">비밀번호 확인</p>
            <div class="input_wrapper">
                <input class="login_input password check_input" type="password" placeholder="비밀번호를 다시 입력해주세요">
                <img class="toggle_pw check_img" src="img/btn_visibility_off.png" alt="비밀번호 확인">
            </div>
            <button class="login_btn">로그인</button>
            <div class="sns">
                <span class="sns_tx">간편 로그인하기</span>
                <div class="sns_img">
                    <div class="kakao"><a href="https://www.kakaocorp.com/page/"><img src="img/kakao.png" alt="kakao"></a></div>
                    <div class="google"><a href="https://www.google.com/"><img src="img/google.png" alt="google"></a></div>
                </div>
            </div>
            <div class="singup">
                <span>이미 회원이신가요?</span>
                <a class="singup_tx" href="/login.html">로그인</a>
            </div>
        </div>
    </div>
</body>
<script src="js/login.js"></script>
</html>

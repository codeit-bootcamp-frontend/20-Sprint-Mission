<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="판다 마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:url" content="https://hongyohan.netlify.app/" />
    <meta property="og:image" content="https://hongyohan.netlify.app/img/logo.svg" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="css/auth.css" />
    <script type="module" src="index.js"></script>
    <title>로그인 | 판다마켓</title>
  </head>
  <body>
    <div id="wrap">
      <main id="cnt" class="login_area">
        <div class="login_wrap">
          <div class="logo_box">
            <a href="/" class="logo blind">홈으로 돌아가기</a>
          </div>
          <form action="/">
            <div class="inp_box">
              <label for="email">이메일</label>
              <input type="text" id="email" />
            </div>
            <div class="inp_box">
              <label for="password">비밀번호</label>
              <input type="password" id="password" />
              <button type="button" class="password_toggle_btn">비밀번호 보이기</button>
            </div>
            <div class="btn_box">
              <button id="loginButton" type="submit" class="btn round large bg_primary_100 full">로그인</button>
            </div>
          </form>
          <div class="easy_login_box">
            간편 로그인하기
            <div class="sns_login_box">
              <a href="#;" class="google_login blind">구글로 로그인하기</a>
              <a href="#;" class="kakao_login blind">카카오톡으로 로그인하기</a>
            </div>
          </div>
          <p class="signup_desc">
            판다마켓이 처음이신가요?
            <a href="signup.html" class="signup_link">회원가입</a>
          </p>
        </div>
      </main>
    </div>
  </body>
</html>

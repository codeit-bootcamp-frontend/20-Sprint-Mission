<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/login.css">
    <title>login</title>
</head>
<body>
    <div class="login_box">
        <div class="logo_img"><a href="/index.html"><img src="img/lg.png" alt="판다마켓"></a></div>
        <div class="login_text">
            <p class="login_tx">이메일</p>
            <input class="login_input" type="text" placeholder="이메일을 입력해주세요">
            <p class="login_tx">비밀번호</p>
            <div class="input_wrapper">
                <input class="login_input" type="password" placeholder="비밀번호를 입력해주세요">
                <img class="toggle_pw" src="img/btn_visibility_on.png" alt="비밀번호 보기">
            </div>
            <button class="login_btn">로그인</button>

            <div class="sns">
                <span class="sns_tx">간편 로그인하기</span>
                <div class="sns_img">
                    <div class="kakao"><a href="https://www.kakaocorp.com/page/"><img src="img/kakao.png" alt="kakao"></a></div>
                    <div class="google"><a href="https://www.google.com/"><img src="img/google.png" alt="google"></a></div>
                </div>
            </div>
            <div class="singup">
                <span>판다마켓이 처음이신가요?</span>
                <a class="singup_tx" href="singup.html">회원가입</a>
            </div>
        </div>
    </div>
</body>
</html>

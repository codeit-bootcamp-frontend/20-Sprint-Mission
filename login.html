<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="login.css" />
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <title>판다마켓</title>
  </head>
  <body>
    <div class="login">
      <div id="logo">
        <a href="/">
          <img src="img/img/Logo/Property 1=md@3x.png" alt="판다마켓" />
        </a>
      </div>
      <form>
        <div class="input-text">
          <label for="email">이메일</label>
          <input type="text" id="email" />
        </div>
        <div class="input-text">
          <label for="email">비밀번호</label>
          <input type="password" id="password" />
        </div>
        <div class="input-text">
          <input type="submit" id="login-button" value="로그인" />
        </div>
      </form>
      <div class="easy-login">
        <span>간편 로그인하기</span>
        <a href="https://www.google.com/">
          <img src="img/icon/google.png" alt="구글 로고" />
        </a>
        <a href="https://www.kakaocorp.com/page/" alt="카카오 로고">
          <img src="img/icon/kakao.png" />
        </a>
      </div>
    </div>
  </body>
</html>

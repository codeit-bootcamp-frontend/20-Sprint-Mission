<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - 로그인 페이지</title>
    <link rel="stylesheet" href="/css/utils.css" />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body>
    <section>
      <h1>
        <a class="logo" href="/">
          <img src="imgs/lgLogo.png" alt="판다마켓 로고" />
        </a>
      </h1>
      <form class="login-container">
        <label for="userEmail">이메일</label>
        <input
          placeholder="이메일을 입력해주세요"
          class="login-input"
          id="userEmail"
          type="email"
        />
        <label for="userPassword">비밀번호</label>
        <div class="password-container">
          <input
            placeholder="비밀번호를 입력해주세요"
            class="login-input"
            id="userPassword"
            type="password"
          />
          <button type="button" class="btn_visibility">
            <img src="/imgs/ic_visibility_off.png" alt="비밀번호 숨기기 버튼" />
          </button>
        </div>
        <button
          disabled
          type="submit"
          id="submit-button"
          class="disabled-button login-button"
        >
          로그인
        </button>
      </form>
      <div class="ease-login-container">
        간편 로그인 하기
        <ul>
          <li>
            <a href="https://www.google.com/" target="_blank">
              <img src="imgs/ic_google.png" alt="구글 아이콘" />
            </a>
          </li>
          <li>
            <a href="https://www.kakaocorp.com/page/" target="_blank">
              <img src="imgs/ic_kakao.png" alt="카카오 아이콘" />
            </a>
          </li>
        </ul>
      </div>
      <div class="to-signup">
        판다마켓이 처음이신가요?<a href="signup.html">회원가입</a>
      </div>
    </section>
  </body>
  <script type="module" src="./js/login.js"></script>
</html>

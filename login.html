<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/basic.css" />
    <link rel="stylesheet" href="css/form.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
  </head>
  <body>
    <div class="form_container">
      <a href="index.html">
        <img class="form_logo_img" src="img/login_logo.png" alt="판다마켓" />
      </a>
      <form class="form_login" onsubmit="login">
        <label class="form_text_input" for="email">이메일</label>
        <input
          id="email"
          type="text"
          class="form_input"
          placeholder="이메일을 입력해주세요"
        />
        <label class="form_text_password" for="password">비밀번호</label>
        <div class="password_wrap">
          <input
            id="password"
            type="password"
            class="form_input_password"
            placeholder="비밀번호를 입력해주세요"
          />
          <input type="button" class="password_eye" />
        </div>
        <button class="form_button" type="submit">로그인</button>
      </form>
      <div class="simple_section">
        <p>간편 로그인하기</p>
        <div class="simple_section_icon">
          <a href="https://www.google.com">
            <img src="img/google_icon.png" alt="구글_아이콘" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img src="img/kakao_icon.png" alt="카카오_아이콘" />
          </a>
        </div>
      </div>
      <p class="form_bottom_text">
        판다마켓이 처음이신가요? <a href="singup.html">회원가입</a>
      </p>
    </div>
  </body>
</html>

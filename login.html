<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="icon" href="images/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/auth.css" />
  </head>
  <body>
    <div class="wrapper">
      <a href="/" class="logo">
        <img src="/images/logo.webp" alt="판다마켓 로고" width="300" />
      </a>
      <form action="">
        <label for="login-email">이메일</label>
        <input id="login-email" name="email" type="email" />

        <label for="login-password">비밀번호</label>
        <div class="pw-wrapper">
          <input id="login-password" name="password" type="password" />
          <button type="button">
            <img
              src="/images/no-view-pw.webp"
              alt="비밀번호 뷰 아이콘"
              width="30"
            />
          </button>
        </div>

        <button type="submit" class="button auth-bt">로그인</button>
      </form>

      <div class="simple-login">
        <p>간편 로그인하기</p>
        <div>
          <a
            href="https://www.google.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="/images/google-login.webp" alt="구글 로그인" width="50" />
          </a>
          <a
            href="https://www.kakaocorp.com/page/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              src="/images/kakao-login.webp"
              alt="카카오 로그인"
              width="50"
            />
          </a>
        </div>
      </div>
      <p class="account-message">
        판다마켓이 처음이신가요? <a href="./signup.html">회원가입</a>
      </p>
    </div>
  </body>
</html>

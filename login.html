<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>판다 마켓</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <div class="container">
      <a href="/"><img id="panda-market" src="/images/logo.png" /></a>
      <div class="inner-container">
        <div class="input-title">이메일</div>
        <input
          class="login-input"
          type="email"
          placeholder="이메일을 입력해주세요"
        />
        <div class="input-title">비밀번호</div>
        <input
          class="login-input"
          type="password"
          placeholder="비밀번호를 입력해주세요"
        />
        <button class="login-button blue-button">로그인</button>
        <div class="simple-login">
          <div>간편 로그인하기</div>
          <div class="sns-buttons">
            <a href="https://www.google.com/"
              ><img class="sns-button" src="/images/google.png"
            /></a>
            <a href="https://www.kakaocorp.com/page/"
              ><img class="sns-button" src="/images/kakao.png"
            /></a>
          </div>
        </div>
        <div class="register" id="register-panel">
          판다마켓이 처음이신가요?
          <a id="register-link" href="/signup.html">회원가입</a>
        </div>
      </div>
    </div>
  </body>
</html>

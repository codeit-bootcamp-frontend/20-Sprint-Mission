<!DOCTYPE html>
<html lang='ko'>
    <head>
        <meta charset="utf-8">
        <title>판다마켓</title>
        <link rel="stylesheet" href="pandamarket.css">
    </head>
    <body>
       <header>
        <div class='navbar-container'>
          <a href="/">
           <img class='logo' src='./img/logo.png' alt='판다마켓로고'>
          </a>
          <a href="/login">
           <button class='login'>로그인</button>
          </a>
        </div>  
       </header>


       <main>
        <div class="main-container">
            <div class='main-text-btn'>
                <h1 class='main-text'>
                일상의 모든 물건을<br>거래해보세요
                </h1>
                <a href="/items">
                  <button class='visit-btn'>구경하러 가기</button>
                </a>
            </div>
            <img src='./img/header.png' alt='logo'>
        </div>
       </main>


       <div class="part1">
        <section class='section1'>
            <img class='left-content' src='./img/section1.png' alt='인기상품일러스트'>
            <div class='right-content'> 
                <p class='point'>Hot item</p>
                <h2 class="text">인기 상품을<br>확인해보세요</h2>
                <h2 class="desc">가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</h2>
            </div> 
        </section>
       </div>


       <div class="part2">
        <section class='section2'>
            <div class='left-content2'> 
                <p class='point'>Search</p>
                <h2 class="text">구매를 원하는<br>상품을 검색하세요</h2>
                <h2 class="desc">구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</h2>
            </div>
            <img class='right-content2' src='./img/section2.png' alt='구매일러스트'>
        </section>
        </div>


        <div class="part3">
          <section class='section3'>
            <img class='left-content' src='./img/section3.png' alt='판매일러스트'>
            <div class='right-content'> 
                <p class='point'>Register</p>
                <h2 class="text">판매를 원하는<br>상품을 등록하세요</h2>
                <h2 class="desc">어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</h2>
            </div>
          </section>
        </div>


        <div class='empty'></div>


       <footer>
           <div class="foot">
                <h2 class='text3'>믿을 수 있는<br>판다마켓 중고 거래</h2>
                <img class='right-content3' src='./img/footer.png' alt='logo'>
           </div>
       </footer>

       
       <section>
        <div class="part4">
         <div class="underbar">
          <p class='codeit'>@codeit - 2024</p>
          <h3 class="ppf">
            <a href="/privacy">
                <a class="privacy" href="/privacy">Privacy Policy</a>
            </a>
            <a href="/faq">
                <a class='faq' href="/faq">FAQ</a>
            </a>
          </h3>
          <h3 class="logos">
            <a href="https://www.facebook.com/?locale=ko_KR"> 
              <img src='./img/facebook.png' alt='페이스북로고'>
            </a>
            <a href="https://x.com/?lang=ko">
              <img src='./img/twitter.png' alt='트위터로고'>
            </a>
            <a href="https://www.youtube.com/?app=desktop&hl=ko&gl=KR">    
              <img src='./img/youtube.png' alt='유튜브로고'>
            </a>
            <a href="https://www.instagram.com/">    
              <img src='./img/instagram.png' alt='인스타로고'>
            </a> 
          </h3>
         </div>
        </div>
       </section>
    </body>
</html>

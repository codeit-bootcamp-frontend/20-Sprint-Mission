<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="판다 마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:url" content="https://pandamarket.example.com/" />
    <meta property="og:image" content="https://pandamarket.example.com/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="판다 마켓" />
    <meta name="twitter:description" content="일상의 모든 물건을 거래해보세요" />
    <meta name="twitter:image" content="https://pandamarket.example.com/og-image.png" />

    <link rel="stylesheet" href="src/shared/style/reset.css" />
    <link rel="stylesheet" href="src/shared/font/font.css" />
    <link rel="stylesheet" href="src/shared/style/color.css" />
    <link rel="stylesheet" href="src/shared/style/style.css" />
    <title>판다마켓</title>
  </head>

  <body>
    <header class="header">
      <div class="headerInner">
        <a href="./" class="logoContainer">
          <img
            class="logoImg"
            src="src/shared/img/logo/brand/logo.svg"
            alt="logoImg"
          />
          <img
            src="src/shared/img/logo/brand/logoText.svg"
            alt="logoText"
          />
        </a>
        <a href="./src/pages/login/login.html" class="loginButton">로그인</a>
      </div>
    </header>

    <section class="banner">
      <div class="bannerContainer">
        <h2 class="bannerTitle">
          일상의 모든 물건을<br />
          거래해 보세요
        </h2>
        <button
          class="seeButton"
          type="button"
          onclick="location.href='/items'"
        >
          구경하러 가기
        </button>
      </div>
      <img
        src="src/shared/img/banner/banner01.svg"
        class="bannerImg"
        alt="판다 배너 이미지"
      />
    </section>

    <section class="bannerLeft">
      <div class="bannerContent">
        <img
          class="bannerImg02"
          src="src/shared/img/banner/banner02.svg"
          alt="판다 배너 이미지"
        />
        <div class="bannerText">
          <p class="sectionLabel">Hot Item</p>
          <h2 class="bannerTitle">
            인기 상품을<br />
            확인해 보세요
          </h2>
          <p class="bannerSubTitle">
            가장 HOT한 중고거래 물품을<br />
            판다마켓에서 확인해 보세요
          </p>
        </div>
      </div>
    </section>

    <section class="bannerRight">
      <div class="bannerContent">
        <div class="bannerText">
          <p class="sectionLabel">Search</p>
          <h2 class="bannerTitle">
            구매를 원하는 <br />상품을 검색하세요
          </h2>
          <p class="bannerSubTitle">
            구매하고 싶은 물품은 검색해서<br />
            쉽게 찾아보세요
          </p>
        </div>
        <img
          class="bannerImg02"
          src="src/shared/img/banner/banner03.svg"
          alt="판다 배너 이미지"
        />
      </div>
    </section>

    <section class="bannerLeft">
      <div class="bannerContent">
        <img
          class="bannerImg02"
          src="src/shared/img/banner/banner04.svg"
          alt="판다 배너 이미지"
        />
        <div class="bannerText">
          <p class="sectionLabel">Register</p>
          <h2 class="bannerTitle">
            판매를 원하는<br />
            상품을 등록하세요
          </h2>
          <p class="bannerSubTitle">
            어떤 물건이든 판매하고 싶은 상품을<br />
            쉽게 등록하세요
          </p>
        </div>
      </div>
    </section>

    <section class="banner">
      <div class="bannerContainer">
        <h1 class="bannerTitle">
          믿을 수 있는<br />
          판다마켓 중고 거래
        </h1>
      </div>
      <img
        src="src/shared/img/banner/banner05.svg"
        class="bannerImg"
        alt="판다 배너 이미지"
      />
    </section>

    <footer class="footer">
      <div class="footerContainer">
        <p>©codeit - 2024</p>
        <div class="buttonContainer">
          <button type="button" onclick="location.href='/privacy'">
            Privacy Policy
          </button>
          <button type="button" onclick="location.href='/faq'">FAQ</button>
        </div>
        <ul class="snsButtonContainer">
          <li>
            <a
              href="https://www.facebook.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="src/shared/img/logo/sns/ic_facebook.svg"
                alt="facebookButton"
                class="snsLogo"
              />
            </a>
          </li>
          <li>
            <a
              href="https://x.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="src/shared/img/logo/sns/ic_twitter.svg"
                alt="twitterButton"
                class="snsLogo"
              />
            </a>
          </li>
          <li>
            <a
              href="https://www.youtube.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="src/shared/img/logo/sns/ic_youtube.svg"
                alt="youtubeButton"
                class="snsLogo"
              />
            </a>
          </li>
          <li>
            <a
              href="https://www.instagram.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="src/shared/img/logo/sns/ic_instagram.svg"
                alt="instagramButton"
                class="snsLogo"
              />
            </a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>

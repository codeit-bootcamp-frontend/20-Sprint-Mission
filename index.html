<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a class="header-logo" href="index.html"></a>
            <a class="header-logo-mobile" href="index.html"></a>
            <a class="header-button" href="./login/login.html">로그인</a>
        </div>
    </header>
    <main>
        <div class="main-top">
            <div class="main-top-text-container">
                <div class="main-top-text">일상의 모든 물건을  <br>거래해 보세요</div>
                <a class="main-top-text-button">구경하러 가기</a>
            </div>
            
            <img class="main-top-image" src="./images/onboard/home_top.png" alt="탑이미지">
        </div>

        <div class="main-section-container">
            <div class="main-section">
                <img class="main-section-image" src="./images/onboard/home_01.png" alt="인기아이템템">

                <div class="main-section-text">
                    <div class="main-section-text-primary">Hot item</div>
                    <div class="main-section-text-title">인기 상품을 <br class="tablet-br mobile-br">확인해 보세요</div>
                    <div class="main-section-text-subtitle">가장 HOT한 중고거래 물품을<br> 판다 마켓에서 확인해 보세요</div>

                </div>
            </div>
            
            <div class="main-section" id="main-section-text-2">

                <div class="main-section-text" >
                    <div class="main-section-text-primary">Search</div>
                    <div class="main-section-text-title">구매를 원하는<br class="tablet-br, mobile-br">상품을 검색하세요</div>
                    <div class="main-section-text-subtitle">구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</div>
                </div>
                <img class="main-section-image" src="./images/onboard/home_02.png" alt="검색">

            </div>
        
            <div class="main-section">
                <img class="main-section-image" src="./images/onboard/home_03.png" alt="등록">

                <div class="main-section-text">
                    <div class="main-section-text-primary">Register</div>
                    <div class="main-section-text-title">판매를 원하는<br class="tablet-br, mobile-br">상품을 등록하세요</div>
                    <div class="main-section-text-subtitle">어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</div>
                </div>

            </div>
        </div>
        <div class="main-bottom">
            <div class="main-bottom-text">믿을 수 있는 <br class="tablet-br">판다마켓 중고 거래</div>
            <img class="main-bottom-image" src="./images/onboard/home_bottom.png" alt="바텀이미지">

        </div>

    </main>
    <footer>
        <div class="footer-container">
            <div class="footer-text">
                <p>©codeit - 2024</p>

<!DOCTYPE html>
<html lang="ko">

    <title>판다마켓</title>
    <link rel="stylesheet" href="/css/base.css" />

    <link rel="stylesheet" href="/css/footer.css" />

  <body>
    <header>
      <div class="header-inner">
        <h1>
          <a id="logo" href="/" rel="home" aria-label="판다마켓 홈">
            <img src="./imgs/smLogo.png" />
          </a>
        </h1>
        <a href="/login.html" id="login-button">로그인</a>
      </div>
    </header>
    <main>
      <section class="top-bottom-section part-1">
        <div>
          <h2 class="sub-title">
            일상의 모든 물건을<br />
            거래해 보세요
          </h2>
          <a href="/items.html">구경하러 가기</a>
        </div>
        <div>
          <img src="imgs/Img_home_top.png" alt="언덕위 판다" />
        </div>
      </section>
      <section class="main-section part-2">
        <div>
          <img src="imgs/Img_home_01.png" alt="판다 이미지 1" />
        </div>
        <div>
          <div class="highlight">Hot itme</div>
          <h2 class="sub-title">
            인기 상품을<br />

            가장 HOT한 중고거래 물품을 <br />

          </p>
        </div>

      <section class="main-section part-3">

          <h2 class="sub-title">
            구매를 원하는<br />

          </h2>
          <p class="description">
            구매하고 싶은 물품은 검색해서 <br />
            쉽게 찾아보세요
          </p>
        </div>
        <div>
          <img src="imgs/Img_home_02.png" alt="판다 이미지 2" />
        </div>
      </section>
      <section class="main-section part-4">
        <div>
          <img src="imgs/Img_home_03.png" alt="판다 이미지 3" />
        </div>
        <div>
          <div class="highlight">Register</div>
          <h2 class="sub-title">
            판매를 원하는<br />
            상품을 등록하세요
          </h2>
          <p class="description">
            어떤 물건이든 판매하고 싶은 상품을<br />
            쉽게 등록하세요
          </p>
        </div>
      </section>
      <section class="top-bottom-section part-5">
        <div>
          <h2 class="sub-title">
            일상의 모든 물건을 <br />
            거래해 보세요
          </h2>
        </div>
        <div>
          <img src="imgs/Img_home_bottom.png" alt="언덕위 판다" />
        </div>
      </section>

    <footer>

          <li>

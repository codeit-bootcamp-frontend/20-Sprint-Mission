<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>판다 마켓</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <header>
      <nav class="header">
        <a href="/"
          ><img src="images/logo.png" alt="판다 로고" class="header-logo"
        /></a>
        <a href="login.html" class="login-button blue-button" alt="로그인 버튼"
          >로그인</a
        >
      </nav>
    </header>

    <section class="hero">
      <div class="hero-content">
        <div class="hero-left">
          <div class="hero-left-text">일상의 모든 물건을 거래해 보세요</div>
          <a href="items.html" class="blue-button view-button">구경하러 가기</a>
        </div>
        <img src="images/Img_home_top.png" alt="판다" />
      </div>
    </section>

    <section class="part">
      <div class="container">
        <img src="images/Img_home_01.png" alt="hot-item" />
        <div class="text-content">
          <h2 class="part-name">Hot item</h2>
          <strong class="part-title">
            <div>인기 상품을</div>
            <div>확인해 보세요</div>
          </strong>
          <p class="part-message">
            가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
          </p>
        </div>
      </div>
    </section>

    <section class="part2">
      <div class="container">
        <img
          class="container-img-pre"
          src="images/Img_home_02.png"
          alt="search"
        />
        <div class="search-text-content align-end">
          <h2 class="part-name">search</h2>
          <strong class="part-title text-right">
            <div>구매를 원하는</div>
            <div>상품을 검색하세요</div>
          </strong>
          <p class="part-message text-right">
            구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
          </p>
        </div>
        <img
          class="container-img-post"
          src="images/Img_home_02.png"
          alt="search"
        />
      </div>
    </section>

    <section class="part3">
      <div class="container">
        <img src="images/Img_home_03.png" alt="register" />
        <div class="register-text-content">
          <h2 class="part-name">Register</h2>
          <strong class="part-title">
            <div>판매를 원하는</div>
            <div>상품을 등록하세요</div>
          </strong>
          <p class="part-message">
            어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
          </p>
        </div>
      </div>
    </section>

    <section class="lower-part">
      <div class="lower-part-container">
        <div class="lower-part-message">
          <div>믿을 수 있는</div>
          <div>판다마켓 중고 거래</div>
        </div>
        <img src="images/Img_home_bottom.png" />
      </div>
    </section>

    <footer class="footer">
      <div class="footer-container-column">
        <div class="footer-container-row">
          <div class="codeit-link">@codit - 2024</div>
          <div class="privacy-policy-link">
            <a href="privacy.html">Privacy Policy</a>
            <a href="faq.html">FAQ</a>
          </div>
          <div class="images">
            <a href="/facebook.html" target="_blank"
              ><img src="images/ic_facebook.png"
            /></a>
            <a href="/twitter.html" target="_blank"
              ><img src="images/ic_twitter.png"
            /></a>
            <a href="/youtube.html" target="_blank"
              ><img src="images/ic_youtube.png"
            /></a>
            <a href="/instagram.html" target="_blank"
              ><img src="images/ic_instagram.png"
            /></a>
          </div>
        </div>
        <div class="codeit-link2">@codit - 2024</div>
      </div>
    </footer>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
</head>
<body>
    <header>
        <div class="header-container">
            <a href="index.html"><img src="/img/Property 1=md.png" alt="판다마켓 로고" width="130px">
            </a>
            <div class="login"><a href="login.html">로그인</a></div>
        </div>
    </header>

    <main>
        <section class="blue-top">
            <div id="top" class="blue-container" >
                <div class="text-box">
                    <h1>일상의 모든 물건을 <br>거래해 보세요</h1>
                    <div><a href="items.html">구경하러 가기</a></div>
                </div>
                <img id="img-home-top" src="img/Img_home_top.svg" alt="홈 탑 이미지">
            </div>
        </section>

        <section class="popular">
            <div class="white-container">
                <div class="content-box">
                    <img src="/img/Img_home_01.svg" alt="home img 1">
                    <div class="texts">
                        <p class="category">Hot item</p>
                        <h1>인기 상품을<br>확인해 보세요</h1>
                        <p class="description">
                            가장 HOT한 중고거래 물품을<br>
                            판다 마켓에서 확인해보세요
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <section class="search">
            <div class="white-container">
                <div class="content-box">
                    <div class="texts">
                        <p class="category">Search</p>
                        <h1>구매를 원하는<br>상품을 검색하세요</h1>
                        <p class="description">
                            구매하고 싶은 물품은 검색해서<br>
                            쉽게 찾아보세요
                        </p>
                    </div>
                    <img src="/img/Img_home_02.svg" alt="home img 2">
                </div>
            </div>
        </section>

        <section class="register">
            <div class="white-container">
                <div class="content-box">
                    <img src="/img/Img_home_03.svg" alt="home img 3">
                    <div class="texts second">
                        <p class="category">Register</p>
                        <h1>판매를 원하는<br>상품을 등록하세요</h1>
                        <p class="description">
                            어떤 물건이든 판매하고 싶은 상품을<br>
                            쉽게 등록하세요
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <section class="blue-bottom">
            <div id="bottom" class="blue-container" >
                <h1>믿을 수 있는<br>판다마켓 중고거래</h1>
                <img src="img/Img_home_bottom.svg" alt="홈 바텀 이미지">
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-conatiner">
            <span>@codeit·2024</span>
            <div class="footer-link">
                <a href="privacy.html">Privacy Policy</a>
                <a href="faq.html">FAQ</a>
            </div>
            <div class="footer-button">
                <a href="https://facebook.com" target="_blank ">
                    <img id="facebook" src="/img/facebook_w.svg" alt="facebook icon">
                </a>
                <a href="https://twitter.com" target="_blank">
                    <img id="twitter" src="/img/twiiter_w.svg" alt="twitter icon">
                </a>
                <a href="https://youtube.com" target="_blank"><img id="youtube" src="/img/youtube_w.svg" alt="youtube icon">
                </a>
                <a href="https://instagram.com" target="_blank"><img id="instagram" src="/img/instagram_w.svg" alt="instagram icon"></a>
            </div>
        </div>
    </footer>
</body>
</html>

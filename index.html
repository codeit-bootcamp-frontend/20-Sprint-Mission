<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <header class="center-basic">
      <div class="header-bar">
        <a href="/">
          <img class="title" src="img/img/Logo/Property 1=md.png" alt="" />
        </a>
        <div class="login">
          <a href="/login">로그인</a>
        </div>
      </div>
    </header>
    <section class="section-look center-basic">
      <div class="section-look-contents">
        <div class="section-look-content">
          <h2>일상의 모든 물건을<br />거래해 보세요</h2>
          <div class="look-button">
            <a href="/items">구경하러 가기</a>
          </div>
        </div>
        <img src="img/img/Landing page/Img_home_top.png" />
      </div>
    </section>
    <section class="section-items center-basic">
      <div class="section-item">
        <img src="img/img/Landing page/Img_home_01.png" />
        <div class="intro-text">
          <p class="hot">Hot item</p>
          <h2>인기 상품을<br />확인해 보세요</h2>
          <p class="explan">
            가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
          </p>
        </div>
      </div>
    </section>
    <section class="section-items center-basic">
      <div class="reverse-item">
        <div class="intro-text reverse-intro">
          <p class="hot">Search</p>
          <h2>구매를 원하는<br />상품을 검색하세요</h2>
          <p class="explan">
            구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
          </p>
        </div>
        <img src="img/img/Landing page/Img_home_02.png" />
      </div>
    </section>
    <section class="section-items center-basic last-item">
      <div class="section-item">
        <img src="img/img/Landing page/Img_home_03.png" />
        <div class="intro-text">
          <p class="hot">Register</p>
          <h2>판매를 원하는<br />상품을 등록하세요</h2>
          <p class="explan">
            가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
          </p>
        </div>
      </div>
    </section>
    <section class="banner center-basic">
      <div class="banner-contents">
        <div class="banner-content">
          <h2>믿을 수 있는<br />판다마켓 중고 거래</h2>
        </div>
        <img src="img/img/Landing page/Img_home_bottom.png" />
      </div>
    </section>
    <footer class="center-basic"></footer>
  </body>
</html>

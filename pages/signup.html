<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="auth_container">
      <div class="auth_logo">
        <a href="../index.html">
          <img class="auth_logo_img" src="../img/logo.png" alt="logo" />
        </a>
      </div>
      <form>
        <div class="form-field">
          <label class="auth_label" for="signupEmail">이메일</label>
          <input
            class="auth_input"
            id="signupEmail"
            name="accountEmail"
            type="email"
            required
          />
          <div class="error-message" id="signupEmailError"></div>
        </div>

        <div class="form-field">
          <label class="auth_label" for="signupNickname">닉네임</label>
          <input
            class="auth_input"
            id="signupNickname"
            name="nickname"
            type="text"
            required
          />
          <div class="error-message" id="nicknameError"></div>
        </div>

        <div class="form-field">
          <label class="auth_label" for="signupPassword">비밀번호</label>
          <div class="password-input-container">
            <input
              class="auth_input password-input"
              id="signupPassword"
              name="userPw"
              type="password"
              required
            />

            <button
              class="password-toggle"
              id="signupPasswordToggle"
              type="button"
            >
              <img src="../img/eye_off.svg" alt="eye_off" />
            </button>
          </div>
          <div class="error-message" id="signupPasswordError"></div>
        </div>

        <div class="form-field">
          <label class="auth_label" for="signupPasswordCheck"
            >비밀번호 확인</label
          ><br />
          <div class="password-input-container">
            <input
              class="auth_input password-input"
              id="signupPasswordCheck"
              name="userPwCheck"
              type="password"
              required
            />
            <button
              class="password-toggle"
              id="passwordCheckToggle"
              type="button"
            >
              <img src="../img/eye_off.svg" alt="eye_off" />
            </button>
          </div>
          <div class="error-message" id="signupPasswordCheckError"></div>
        </div>

        <button class="auth_button" id="signupButton" type="submit" disabled>
          회원가입
        </button>
      </form>
      <div class="easy_auth">
        <div class="easy_auth_left">간편 로그인 하기</div>
        <div class="easy_auth_right">
          <div class="easy_auth_google">
            <img src="../img/google_logo.svg" alt="google" />
          </div>
          <div class="easy_auth_kakao">
            <img src="../img/kakao_logo.svg" alt="kakao" />
          </div>
        </div>
      </div>
      <div class="auth_link">
        <p>이미 회원이신가요? <a href="login.html">로그인</a></p>
      </div>
    </div>
    <script src="../js/auth.js"></script>
  </body>
</html>

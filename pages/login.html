<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>판다마켓 로그인</title>

    <!-- 파비콘 -->
    <link rel="icon" type="image/png" href="../img/panda_face.png" />

    <!-- SNS 공유 미리보기 메타 태그 -->
    <meta property="og:title" content="판다 마켓 로그인" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta
      property="og:image"
      content="https://flexible.img.hani.co.kr/flexible/normal/640/453/imgdb/original/2023/1122/20231122501048.jpg"
    />
    <meta
      property="og:url"
      content="https://dayeon-codeit-sprint-4.netlify.app/pages/login.html"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="판다 마켓" />

    <!-- Twitter 카드 메타 태그 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="판다 마켓" />
    <meta
      name="twitter:description"
      content="일상의 모든 물건을 거래해보세요"
    />
    <meta
      name="twitter:image"
      content="https://flexible.img.hani.co.kr/flexible/normal/640/453/imgdb/original/2023/1122/20231122501048.jpg"
    />

    <!-- 기본 메타 태그 -->
    <meta name="description" content="일상의 모든 물건을 거래해보세요" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="auth_container">
      <div class="auth_logo">
        <a href="../index.html">
          <img class="auth_logo_img" src="../img/logo.png" alt="logo" />
        </a>
      </div>
      <form>
        <div class="form-field">
          <label class="auth_label" for="loginEmail">이메일</label>
          <input
            class="auth_input"
            id="loginEmail"
            name="accountEmail"
            type="email"
            required
          />
          <div class="error-message" id="emailError"></div>
        </div>

        <div class="form-field">
          <label class="auth_label" for="loginPassword">비밀번호</label>
          <div class="password-input-container">
            <input
              class="auth_input password-input"
              id="loginPassword"
              name="userPw"
              type="password"
              required
            />
            <button class="password-toggle" id="passwordToggle" type="button">
              <img src="../img/eye_off.svg" alt="eye_off" />
            </button>
          </div>
          <div class="error-message" id="passwordError"></div>
        </div>

        <button class="auth_button" id="loginButton" type="submit" disabled>
          로그인
        </button>
      </form>
      <div class="easy_auth">
        <div class="easy_auth_left">간편 로그인 하기</div>
        <div class="easy_auth_right">
          <div class="easy_auth_google">
            <img src="../img/google_logo.svg" alt="google" />
          </div>
          <div class="easy_auth_kakao">
            <img src="../img/kakao_logo.svg" alt="kakao" />
          </div>
        </div>
      </div>
      <div class="auth_link">
        <p>판다마켓이 처음인가요? <a href="signup.html">회원가입</a></p>
      </div>
    </div>
    <script src="../js/auth.js"></script>
  </body>
</html>
